# ╔══════════════════════════════════════════════════════════════════╗
# ║  hyprpolkitagent — polkit authentication agent for Hyprland        ║
# ║  Enabled as a systemd *user* unit by setup-arch.sh, not launched   ║
# ║  from hyprland.lua's autostart, so it comes up with the session.   ║
# ║                                                                    ║
# ║  Without an agent running, anything that asks for root through     ║
# ║  polkit — thunar mounting a disk, pkexec, a GUI partition editor — ║
# ║  fails with no prompt at all, which looks like the app hanging.    ║
# ║                                                                    ║
# ║  Path is NOT under ~/.config/hypr/ like the other Hypr* tools:     ║
# ║  it reads ~/.config/hyprpolkitagent/hyprpolkitagent.conf.          ║
# ╚══════════════════════════════════════════════════════════════════╝

general {
    # Dialog geometry, in px (defaults: 520 x 440, field 340).
    # Widened a little so long action ids — the likes of
    # "org.freedesktop.udisks2.filesystem-mount-system" — fit on one line
    # in the details panel instead of wrapping.
    window_width         = 560
    window_height        = 440
    password_field_width = 380

    # Keep the collapsible action/command panel reachable. It is the only
    # place that shows *which* action wants the password, which is exactly
    # what you want to check before typing one.
    show_details = true
}
