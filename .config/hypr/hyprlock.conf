# ╔══════════════════════════════════════════════════════════════════╗
# ║  hyprlock — lock screen for Hyprland                               ║
# ║  Blurred-desktop style, pink accent (rgba(F06292ee)).             ║
# ║  Triggered by hypridle via `loginctl lock-session`.               ║
# ╚══════════════════════════════════════════════════════════════════╝

general {
    hide_cursor        = true
    grace              = 2          # seconds of mouse/key after lock before input is required
    ignore_empty_input = true       # don't try to auth on a blank submit
}

# ── Background: live blurred screenshot of your desktop ─────────────
background {
    monitor    =
    path       = screenshot
    blur_passes = 3
    blur_size   = 8
    noise       = 0.0117
    contrast    = 0.9
    brightness  = 0.82
    vibrancy    = 0.17
}

# ── Big clock ───────────────────────────────────────────────────────
label {
    monitor   =
    text      = cmd[update:1000] echo "$(date '+%H:%M')"
    color     = rgba(F06292ee)
    font_size = 112
    font_family = IosevkaTerm Nerd Font ExtraBold
    position  = 0, 220
    halign    = center
    valign    = center
    shadow_passes = 3
    shadow_size   = 6
}

# ── Date ────────────────────────────────────────────────────────────
label {
    monitor   =
    text      = cmd[update:18000000] echo "$(date '+%A, %d %B')"
    color     = rgba(ffffffff)
    font_size = 22
    font_family = IosevkaTerm Nerd Font
    position  = 0, 120
    halign    = center
    valign    = center
}

# ── Password input field ────────────────────────────────────────────
input-field {
    monitor      =
    size         = 320, 56
    outline_thickness = 2
    dots_size    = 0.28
    dots_spacing = 0.32
    dots_center  = true
    rounding     = 14

    outer_color  = rgba(F06292ee)
    inner_color  = rgba(212121dd)
    font_color   = rgba(ffffffff)
    check_color  = rgba(F06292ee)   # while verifying
    fail_color   = rgba(F44336ee)   # wrong password

    placeholder_text = <span foreground="##9e9e9e">  $USER</span>
    fail_text        = <span foreground="##F44336">  $FAIL  ($ATTEMPTS)</span>

    position     = 0, -40
    halign       = center
    valign       = center
}

# ── Small hint line under the field ────────────────────────────────
label {
    monitor   =
    text      = 󰌾  locked
    color     = rgba(9e9e9ecc)
    font_size = 13
    font_family = IosevkaTerm Nerd Font
    position  = 0, -120
    halign    = center
    valign    = center
}
