# ╔══════════════════════════════════════════════════════════════════╗
# ║  hyprland-qt-support — the QML style shared by the Hypr* Qt tools  ║
# ║  On this setup hyprpolkitagent's dialog is its only consumer.      ║
# ║                                                                    ║
# ║  These three options are top-level: hyprlandstyle.cpp registers    ║
# ║  them as bare names, so wrapping them in a general { } block the   ║
# ║  way hyprpolkitagent.conf does would not parse.                    ║
# ║                                                                    ║
# ║  There is no accent-colour option, so the pink (#F06292) used      ║
# ║  everywhere else here cannot be carried into the auth dialog.      ║
# ╚══════════════════════════════════════════════════════════════════╝

# 0..3 (default 1). Matches decoration:rounding = 8 in hyprland.lua as
# closely as this coarse 4-step scale allows.
roundness = 2

# 0..3 (default 1). general:border_size is 1 in hyprland.lua; keep the
# dialog's border in line with the window borders.
border_width = 1

# hyprland.lua runs a full animation set, so no reason to flatten these.
reduce_motion = false
