# ╔══════════════════════════════════════════════════════════════════╗
# ║  hypridle — idle daemon for Hyprland                               ║
# ║  Tuned for this desktop: no battery, no laptop backlight,          ║
# ║  external monitor driven over DDC (so brightness dimming is        ║
# ║  unreliable here and intentionally left out).                      ║
# ╚══════════════════════════════════════════════════════════════════╝

general {
    # Route every lock request (manual `loginctl lock-session`, the timeout
    # below, and before-sleep) through one command. `pidof` guard means we
    # never stack two lockers on top of each other.
    # hyprlock is installed by setup-arch.sh and themed in hyprlock.conf.
    lock_cmd       = pidof hyprlock || hyprlock

    # Lock + pause media right before the machine suspends...
    before_sleep_cmd = loginctl lock-session; playerctl --all-players pause
    # ...and make sure the monitor comes back when we wake up.
    after_sleep_cmd  = hyprctl dispatch dpms on

    # Respect apps that ask to stay awake (fullscreen video, presentations,
    # `systemd-inhibit`, etc.) so we don't blank the screen mid-movie.
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# ── 4 min: gentle heads-up that the lock is coming ──────────────────
listener {
    timeout    = 240
    on-timeout = notify-send -u low -t 8000 -i system-lock-screen "💤 Idle" "Locking the session in 60 seconds…"
}

# ── 5 min: lock the session ─────────────────────────────────────────
# Goes through general.lock_cmd via loginctl, so it dedupes cleanly.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# ── 5.5 min: pause any playing media, then power the displays off ───
listener {
    timeout    = 330
    on-timeout = playerctl --all-players pause; hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# ── 30 min: suspend the whole machine ───────────────────────────────
# It's a desktop, so this is opt-in. Uncomment to save real power when
# you wander off for a while. before_sleep_cmd/after_sleep_cmd above
# handle locking and waking the display around it.
# listener {
#     timeout    = 1800
#     on-timeout = systemctl suspend
# }
