# ╔══════════════════════════════════════════════════════════════════╗
# ║  hyprpaper — wallpaper daemon                                      ║
# ║                                                                    ║
# ║  Deliberately no `preload`/`wallpaper` here: hyprland.lua picks a   ║
# ║  random file from ~/Pictures/wallpapers at startup and pushes it    ║
# ║  over IPC, so anything set here would only be overwritten a second  ║
# ║  later. setup-arch.sh populates that folder from wallpapers/.       ║
# ╚══════════════════════════════════════════════════════════════════╝

# Required for `hyprctl hyprpaper wallpaper ...` to be accepted (default on;
# stated explicitly because the whole wallpaper flow depends on it).
ipc = on

# No "hyprpaper" splash text over the wallpaper.
splash = false
